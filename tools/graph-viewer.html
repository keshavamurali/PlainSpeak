<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PlainSpeak Graph Viewer</title>
  <script src="https://unpkg.com/vis-network@9.1.2/standalone/umd/vis-network.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #f8fafc; }
    .header {
      padding: 12px 16px;
      background: white;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    h1 { margin: 0; font-size: 16px; font-weight: 600; color: #334155; }
    .btn {
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 500;
      border-radius: 8px;
      border: 1px solid #c4b5fd;
      background: #ede9fe;
      color: #6d28d9;
      cursor: pointer;
    }
    .btn:hover { background: #ddd6fe; }
    .btn-secondary { background: #f1f5f9; border-color: #cbd5e1; color: #475569; }
    .btn-secondary:hover { background: #e2e8f0; }
    input[type="file"] { display: none; }
    .view-select {
      padding: 8px 12px;
      font-size: 14px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: white;
      color: #334155;
      cursor: pointer;
    }
    .container { display: flex; height: calc(100vh - 50px); }
    .graph-area { flex: 1; min-width: 0; position: relative; }
    #network { width: 100%; height: 100%; background: linear-gradient(135deg, #f8fafc 0%, #ede9fe33 100%); }
    .sidebar {
      width: 360px;
      flex-shrink: 0;
      border-left: 1px solid #e2e8f0;
      background: white;
      overflow-y: auto;
      padding: 16px;
    }
    .sidebar h3 { margin: 0 0 12px; font-size: 14px; color: #475569; }
    .sidebar .empty { color: #94a3b8; font-size: 14px; }
    .node-detail { font-size: 13px; }
    .node-detail dt { font-weight: 600; color: #64748b; margin-top: 10px; }
    .node-detail dd { margin: 4px 0 0; color: #334155; }
    .node-detail ul { margin: 4px 0 0; padding-left: 20px; }
    .dtg-mini { margin-top: 12px; padding-top: 12px; border-top: 1px solid #e2e8f0; }
    .dtg-mini h4 { margin: 0 0 8px; font-size: 12px; color: #64748b; text-transform: uppercase; }
    .status-badge { display: inline-block; padding: 2px 8px; font-size: 11px; border-radius: 4px; }
    .status-completed { background: #d1fae5; color: #065f46; }
    .status-running { background: #dbeafe; color: #1e40af; }
    .status-failed { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>
  <div class="header">
    <h1>PlainSpeak Graph Viewer</h1>
    <input type="file" id="fileInput" accept=".json,application/json" />
    <button class="btn" id="loadBtn">Load graph JSON</button>
    <select id="viewMode" class="view-select" style="display:none">
      <option value="hlig">HLIG</option>
    </select>
    <button class="btn btn-secondary" id="clearBtn" style="display:none">Clear</button>
    <span id="filename" style="font-size:13px;color:#64748b;margin-left:auto"></span>
  </div>
  <div class="container">
    <div class="graph-area">
      <div id="network"></div>
    </div>
    <div class="sidebar">
      <h3>Node / Edge details</h3>
      <div id="detail" class="empty">Select a node or edge, or load a graph file</div>
    </div>
  </div>

  <script>
    let network = null;
    let graphData = null;
    let currentEdgesRaw = [];
    let detailEl = document.getElementById("detail");
    let fileInput = document.getElementById("fileInput");
    let loadBtn = document.getElementById("loadBtn");
    let clearBtn = document.getElementById("clearBtn");
    let filenameEl = document.getElementById("filename");
    let viewModeEl = document.getElementById("viewMode");

    loadBtn.onclick = () => fileInput.click();
    clearBtn.onclick = () => { graphData = null; render(); updateViewModeOptions(); filenameEl.textContent = ""; clearBtn.style.display = "none"; detailEl.innerHTML = '<span class="empty">Select a node or load a graph file</span>'; };
    viewModeEl.onchange = () => { render(); detailEl.innerHTML = '<span class="empty">Select a node</span>'; };

    fileInput.onchange = (e) => {
      const f = e.target.files?.[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        try {
          const parsed = JSON.parse(r.result);
          graphData = parsed.hlig_graph || (parsed.nodes && parsed.edges ? parsed : null);
          if (graphData?.nodes?.length) {
            updateViewModeOptions();
            render();
            filenameEl.textContent = f.name;
            clearBtn.style.display = "inline-block";
          } else {
            alert("Invalid graph. Expected {nodes, edges} or {hlig_graph: {nodes, edges}}");
          }
        } catch (err) {
          alert("Parse error: " + err.message);
        }
      };
      r.readAsText(f);
      e.target.value = "";
    };

    function updateViewModeOptions() {
      const sel = viewModeEl;
      sel.innerHTML = '<option value="hlig">HLIG</option>';
      sel.style.display = "none";
      if (!graphData?.nodes?.length) return;
      const withDtg = graphData.nodes.filter(n => n.dtg?.nodes?.length);
      if (withDtg.length) {
        withDtg.forEach(n => {
          const opt = document.createElement("option");
          opt.value = n.id;
          opt.textContent = "DTG: " + n.id;
          sel.appendChild(opt);
        });
        sel.style.display = "inline-block";
      }
    }

    function getActiveGraph() {
      const mode = viewModeEl.value || "hlig";
      if (mode === "hlig" || !graphData?.nodes?.length) {
        return { nodes: graphData?.nodes || [], edges: graphData?.edges || [], type: "hlig" };
      }
      const hligNode = graphData.nodes.find(n => n.id === mode);
      const dtg = hligNode?.dtg;
      if (!dtg?.nodes?.length) return { nodes: [], edges: [], type: "dtg" };
      return { nodes: dtg.nodes, edges: dtg.edges || [], type: "dtg", hligId: mode };
    }

    let currentEdgesRaw = [];

    function buildNetworkData() {
      const { nodes, edges: edgesRaw, type } = getActiveGraph();
      currentEdgesRaw = edgesRaw || [];
      if (!nodes?.length) return null;

      const visNodes = new vis.DataSet(nodes.map(n => ({
        id: n.id,
        label: type === "hlig"
          ? n.id + "\n" + (n.task || "").slice(0, 40) + (n.task?.length > 40 ? "…" : "")
          : n.id + "\n" + (n.title || "").slice(0, 40) + (n.title?.length > 40 ? "…" : ""),
        title: type === "hlig" ? (n.task || n.id) : (n.title || n.id),
      })));

      const visEdges = new vis.DataSet(edgesRaw.map((e, i) => ({
        id: "e" + i,
        from: e.from ?? e.source,
        to: e.to ?? e.target,
        label: (e.interface_type || e.dependency_type || ""),
        arrows: "to",
      })));

      return { nodes: visNodes, edges: visEdges, type };
    }

    const options = {
      nodes: {
        shape: "box",
        font: { size: 12, face: "system-ui" },
        margin: 10,
        borderWidth: 2,
        color: { background: "#ede9fe", border: "#8b5cf6" },
      },
      edges: {
        font: { size: 10, align: "middle" },
        smooth: { type: "cubicBezier" },
      },
      layout: { hierarchical: { direction: "UD", sortMethod: "directed" } },
      physics: false,
    };

    function render() {
      const data = buildNetworkData();
      const container = document.getElementById("network");
      if (!data) {
        container.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#94a3b8">Load a graph JSON file (e.g. session_log/.../graph_*.json)</div>';
        return;
      }

      network = new vis.Network(container, data, options);

      network.on("click", (p) => {
        if (p.nodes?.length) {
          const id = p.nodes[0];
          const { nodes, type } = getActiveGraph();
          const node = nodes.find(n => n.id === id);
          renderDetail(node, type);
        } else if (p.edges?.length) {
          const edgeId = p.edges[0];
          const idx = parseInt(edgeId.replace("e", ""), 10);
          const { edges } = getActiveGraph();
          const edge = edges[idx];
          renderEdgeDetail(edge);
        } else {
          detailEl.innerHTML = '<span class="empty">Select a node or edge</span>';
        }
      });
    }

    function renderEdgeDetail(edge) {
      if (!edge) return;
      const from = edge.from ?? edge.source;
      const to = edge.to ?? edge.target;
      let html = '<div class="node-detail">';
      html += `<dl><dt>Edge</dt><dd><code>${escapeHtml(from)} → ${escapeHtml(to)}</code></dd>`;
      if (edge.interface_type) html += `<dt>Interface type</dt><dd>${escapeHtml(edge.interface_type)}</dd>`;
      if (edge.dependency_type) html += `<dt>Dependency type</dt><dd>${escapeHtml(edge.dependency_type)}</dd>`;
      if (edge.description) html += `<dt>Description</dt><dd>${escapeHtml(edge.description)}</dd>`;
      if (edge.causal !== undefined) html += `<dt>Causal</dt><dd>${edge.causal ? "Yes" : "No"}</dd>`;

      const spec = edge.interface_spec;
      if (spec && typeof spec === "object") {
        html += '<div class="dtg-mini"><h4>Interface spec (contract)</h4>';
        if (spec.type) html += `<dt>Type</dt><dd>${escapeHtml(spec.type)}</dd>`;
        if (spec.description) html += `<dt>Description</dt><dd>${escapeHtml(spec.description)}</dd>`;
        if (spec.endpoints?.length) {
          html += '<dt>Endpoints</dt><dd><ul>';
          spec.endpoints.forEach(ep => {
            const m = ep.method || "";
            const path = ep.path || "";
            html += `<li><code>${m} ${path}</code>${ep.response ? " → " + escapeHtml(JSON.stringify(ep.response).slice(0, 80)) + "…" : ""}</li>`;
          });
          html += '</ul></dd>';
        }
        if (spec.schema && Object.keys(spec.schema).length) {
          html += `<dt>Schema</dt><dd><pre style="font-size:11px;overflow:auto;max-height:120px">${escapeHtml(JSON.stringify(spec.schema, null, 2))}</pre></dd>`;
        }
        html += '</div>';
      }
      if (edge.interface_ref) html += `<dt>Interface ref</dt><dd><code>${escapeHtml(edge.interface_ref)}</code></dd>`;

      const dataSpec = edge.data_spec;
      if (dataSpec && typeof dataSpec === "object") {
        html += '<div class="dtg-mini"><h4>Data-flow spec</h4>';
        if (dataSpec.output_ref) html += `<dt>Output ref</dt><dd>${escapeHtml(dataSpec.output_ref)}</dd>`;
        if (dataSpec.input_ref) html += `<dt>Input ref</dt><dd>${escapeHtml(dataSpec.input_ref)}</dd>`;
        if (dataSpec.schema) html += `<dt>Schema</dt><dd><pre style="font-size:11px">${escapeHtml(JSON.stringify(dataSpec.schema))}</pre></dd>`;
        html += '</div>';
      }
      html += "</dl></div>";
      detailEl.innerHTML = html;
    }

    function renderDetail(node, type) {
      if (!node) return;
      let html = '<div class="node-detail">';
      html += `<dl><dt>ID</dt><dd><code>${node.id}</code></dd>`;

      if (type === "hlig") {
        if (node.task) html += `<dt>Task</dt><dd>${escapeHtml(node.task)}</dd>`;
        if (node.inputs?.length) html += `<dt>Inputs</dt><dd><ul>${node.inputs.map(i => "<li>" + escapeHtml(i) + "</li>").join("")}</ul></dd>`;
        if (node.outputs?.length) html += `<dt>Outputs</dt><dd><ul>${node.outputs.map(o => "<li>" + escapeHtml(o) + "</li>").join("")}</ul></dd>`;
        if (node.external_interfaces?.length) html += `<dt>Interfaces</dt><dd>${node.external_interfaces.join(", ")}</dd>`;
        if (node.dtg?.nodes?.length) {
          html += '<div class="dtg-mini"><h4>DTG (' + node.dtg.nodes.length + ' tasks)</h4>';
          html += '<ul style="padding-left:18px;margin:0">';
          node.dtg.nodes.slice(0, 12).forEach(t => {
            html += '<li><strong>' + escapeHtml(t.id) + '</strong> ' + escapeHtml((t.title || "").slice(0, 50)) + (t.title?.length > 50 ? "…" : "") + '</li>';
          });
          if (node.dtg.nodes.length > 12) html += '<li>… +' + (node.dtg.nodes.length - 12) + ' more</li>';
          html += '</ul></div>';
        }
      } else {
        if (node.title) html += `<dt>Title</dt><dd>${escapeHtml(node.title)}</dd>`;
        if (node.description) html += `<dt>Description</dt><dd>${escapeHtml(node.description)}</dd>`;
        if (node.task_type) html += `<dt>Type</dt><dd>${escapeHtml(node.task_type)}</dd>`;
        if (node.inputs_required?.length) html += `<dt>Inputs</dt><dd><ul>${node.inputs_required.map(i => "<li>" + escapeHtml(i) + "</li>").join("")}</ul></dd>`;
        if (node.outputs_produced?.length) html += `<dt>Outputs</dt><dd><ul>${node.outputs_produced.map(o => "<li>" + escapeHtml(o) + "</li>").join("")}</ul></dd>`;
        if (node.dependencies?.length) html += `<dt>Dependencies</dt><dd>${node.dependencies.join(", ")}</dd>`;
      }
      html += "</dl></div>";
      detailEl.innerHTML = html;
    }

    function escapeHtml(s) {
      if (typeof s !== "string") return "";
      const div = document.createElement("div");
      div.textContent = s;
      return div.innerHTML;
    }

    render();
  </script>
</body>
</html>
